    <body>
<div>
        <form action="action_page.php" method="POST">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Samuel" required>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Adenekan" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="enter  password" maxlength="10" minlength="6" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="spants@gmail.com" required>
            <br>
            <label for="phone">Phone no:</label>
            <input type="tel" id="phone" name="phone" placeholder="+2349029552954" required>
            <br>
            <label for="bdate">Birthdate:</label>
            <input type="date" id="bdate" name="bdate">
            <input type="reset" required>
            <br>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="0" max="100" value="1" required>
            <br>
            <div>
                <label for="title">Title:</label>

            <label>Mr.</label>
            <input type="radio" name="title" value="Mr." id="Mr.">
            <label>Mrs.</label>
            <input type="radio" name="title" value="Mrs." id="Mrs.">
            <label>PhD.</label>
            <input type="radio" name="title" value="PhD." id="PhD">
            </div>
            <br>
            <div>
                <label for="payment">Payment:</label>
                <select id="payment" name="payment">
                    <option value="Visa">Visa</option>
                    <option value="Mastercard">Mastercard</option>
                    <option value="Giftcard">Giftcard</option>
                </select>
            </div>
            <br>
            <div>
                <label for="subscribe">Subscribe:</label>
                <input type="checkbox" id="subscribe" name="subscribe">
            </div>
        <input type="submit">
        </form>
