<!DOCTYPE html>
<html>
    <title>Forms in HTML</title>
    <body>
        <form action="index.php" method="POST">

            <label for="username">username:</label>
            <input type="text" id="username" placeholder="Nelsonstyle123" required minlength="6" maxlength="15"><br>


            <label for="Lastname">Lastname:</label>
            <input type="text" id="Lastname" placeholder="Olaniyan" required minlength="6" maxlength="20"><br>


            <label for="Name">Name:</label>
            <input type="text" id="Name" placeholder="Korede" required minlength="6" maxlength="20"><br>


            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="your password" required minlength="6" maxlength="15"><br>


            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Korede19@gmail.com" required minlength="10" maxlength="30"><br>


            <label for="phone">Phone #:</label>
            <input type="tel" id="phone"placeholder="+2348123456789" required minlength="14" maxlength="20"><br>


            <label for="bday">Birthday:</label> 
            <input type="date" id="bday" required><br>


            <label for="quantity">quantity:</label>
            <input type="number" id="quantity" min="1" max="100"><br>

            <label for="title">title:</label>
            <select name="title" id="title">
                <option value="Mr">Mr</option>
                <option value="Mrs">Mrs</option>
                <option value="Miss">Miss</option>
                <option value="Dr">Dr</option>
                <option value="Prof">Prof</option>
            </select><br>

            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br>

            <label for="hobbies">Hobbies:</label>
            <input type="checkbox" id="hobbies" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="hobbies" name="hobbies" value="traveling">
            <label for="traveling">Traveling</label>
            <input type="checkbox" id="hobbies" name="hobbies" value="gaming">
            <label for="gaming">Gaming</label><br>

            <label for="payment">Payment Method:</label>
            <select name="payment" id="payment">
                <option value="creditcard">Credit Card</option>
                <option value="paypal">PayPal</option>
                <option value="banktransfer">Bank Transfer</option>
            </select><br>

            <label for="subscribe">subscribe:</label>
            <input type="checkbox" id="subscribe"><br>
            
            <label for="comments">Comments:</label><br>
            <textarea id="comments" rows="4" cols="50" placeholder="Enter your comments here..."></textarea><br>

            <input type="reset"><br>
            <input type="submit">

        </form>
    </body>
</html>
